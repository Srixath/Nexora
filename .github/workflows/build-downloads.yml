name: Build Nexora downloads

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Bundle the local bridge runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources/node-runtime | Out-Null
          npx esbuild server/bridge.mjs --bundle --platform=node --format=cjs --target=node22 --outfile=src-tauri/resources/bridge.cjs
          $nodeExecutable = (node -p "process.execPath").Trim()
          $nodeDirectory = Split-Path $nodeExecutable
          Copy-Item -LiteralPath $nodeExecutable -Destination src-tauri/resources/node-runtime/node.exe
          Get-ChildItem -LiteralPath $nodeDirectory -Filter '*.dll' | Copy-Item -Destination src-tauri/resources/node-runtime
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Android-APK
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish release downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nexora-Windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: Nexora-Android-APK
          path: release/android
      - uses: softprops/action-gh-release@v2
        with:
          name: Nexora ${{ github.ref_name }}
          body: Windows installer and Android APK for Nexora ${{ github.ref_name }}.
          prerelease: true
          files: |
            release/windows/*.msi
            release/windows/*.exe
            release/android/*.apk
